name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package backend
        run: |
          tar czf /tmp/wanxiang-backend.tar.gz \
            --exclude='node_modules' --exclude='data/*.db*' \
            --exclude='data/backup' --exclude='.env' \
            --exclude='test' --exclude='*.test.js' \
            --exclude='wanxiang.sqlite' \
            -C backend .

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: /tmp/wanxiang-backend.tar.gz
          target: /tmp/
          strip_components: 2

      - name: Run update script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: /opt/wanxiang/update.sh
